version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - VOICE_PORT=8787
      # LiveKit Voice Credentials (optional, for real WebRTC rooms)
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
    restart: unless-stopped
