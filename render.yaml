services:
  - type: web
    name: spherex-sky-backend
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 10000
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
